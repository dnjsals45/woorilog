# 홈 배포 단일 진입점.
#
# 프론트 정적 파일과 API 를 한 출처로 묶는 게 이 파일의 목적입니다.
# 같은 출처가 되면 CORS 설정이 필요 없어지고, 리프레시 쿠키(SameSite=Lax)가
# 별도 설정 없이 그대로 붙습니다. 프론트는 VITE_API_BASE_URL 를 빈 값으로 빌드해
# /api 상대 경로로 요청합니다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 백엔드 업로드 상한이 10MB 입니다. 여기서 먼저 잘라내면 앱이 자기 오류 메시지를
    # 못 보여주고 nginx 413 페이지가 뜨므로 조금 여유를 둡니다.
    client_max_body_size 12m;

    # OCR 은 이미지 크기에 따라 오래 걸립니다. 기본 60초로는 큰 영수증에서 끊깁니다.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 브라우저가 보는 주소가 곧 백엔드가 보는 주소여야 합니다 —
    # 카카오 콜백과 쿠키 도메인이 여기에 걸립니다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 컨테이너 헬스체크와 "서버 살아 있나" 확인용.
    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # 해시가 붙은 산출물은 내용이 바뀌면 파일명이 바뀝니다. 길게 캐시해도 안전합니다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 폰트도 파일명이 해시로 관리됩니다.
    location ~* \.(woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA. 새로고침이나 딥링크(/transactions 등)에서도 index.html 을 돌려줍니다.
    # index.html 자체는 캐시하지 않아야 새 배포가 바로 반영됩니다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
